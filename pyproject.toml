[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"


[project]
name = "biosonic"
description = "The biosonic package contains tools for bioacoustic analysis."
authors = [
  {name = "Lena Gies", email = "lena.gies@univie.ac.at"},
  {name = "Tecumseh Fitch", email = "tecumseh.fitch@unet.univie.ac.at"},
  {name = "Yannick Jadoul", email = "yannick.jadoul@uniroma1.it"}
]
maintainers = [
  {name = "Lena Gies", email = "lena.gies@univie.ac.at"}
]
license = "BSD-3-Clause"
license-files = ["LICENSE*"]
readme = "README.md"
keywords = ["bioacoustics", "signal", "sound synthesis", "biology", "singal processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python"
]
requires-python = ">=3.10"
dependencies = [
  "pandas (>=2.3.3,<3.0.0)",
  "scipy (>=1.16.3,<2.0.0); python_version >= '3.11'",
  "scipy (<1.16.3); python_version < '3.11'",
  "numpy (>=2.4.0, <3.0); python_version >= '3.11'",
  "numpy (<2.4.0); python_version < '3.11'",
]
dynamic = ["version"]

[project.optional-dependencies]
praat = ["praat-textgrids"]
plot = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/lgies23/biosonic"
Documentation = "https://biosonic.readthedocs.io"
Repository = "https://github.com/lgies23/biosonic"
"Bug Tracker" = "https://github.com/lgies23/biosonic/issues"


[tool.poetry]
packages = [
  { include = "biosonic", from = "src" },
]
exclude = [
  ".pre-commit-config.yaml",
  "readthedocs.yml",
  "docs/build/"
]
include = [
  { path = "src/biosonic/_version.py", format = ["sdist", "wheel"] },
  "requirements.txt",
  "docs/make.bat",
  "docs/Makefile",
  "docs/requirements.txt",
  "docs/source/",
  "tests/"
]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry.group.dev.dependencies]
mypy = "*"
pytest = "*"
flake8 = "*"
isort = "*"
pre-commit = "*"
twine = "*"
praat-parselmouth = "*"
nbsphinx = "*"
sphinx-autodoc-typehints = "*"
ipykernel = "*"

[tool.poetry-dynamic-versioning]
enable = true
pattern = "default"
bump = true
strict = true

[tool.poetry-dynamic-versioning.substitution]
files = ["src/biosonic/_version.py"]

[tool.poetry-dynamic-versioning.files."src/biosonic/_version.py"]
persistent-substitution = true
initial-content = """
  __version__ = "0.0.0"
  __version_tuple__ = (0, 0, 0)
"""


[tool.check-manifest]
ignore = [
  ".pre-commit-config.yaml",
  "readthedocs.yaml",
  "check-types.sh",
  "poetry.lock",
  "src/biosonic/_version.py"
]

[tool.flake8]
max-line-length = 160
max-doc-length = 100
extend-ignore = [
  "E125",  # reenable later?
  "E741",
  "W505",  # for now, ignore too long docstrings
]
per-file-ignores = [
  "__init__.py:F401",
  "tests/*:E402,F811",  # Remove after splitting up tests?
]

[tool.isort]
skip = ["docs/source/conf.py"]
line_length = 100
multi_line_output = 3

[tool.pytest]
minversion = "9.0"
pythonpath = ["src"]
addopts = ["--deselect", "src/biosonic/plot.py::biosonic.plot.plot_spectrogram_catalogue"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict = true
show_error_codes = true
pretty = true
exclude = ["tests/", "build/", "dist/", "docs/", "normalized/", "example_data/", "example_usage.ipynb"]
